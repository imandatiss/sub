name: Update subscription

on:
  schedule:
    - cron: "0 */6 * * *"   # هر ۶ ساعت
  workflow_dispatch:         # اجرای دستی

permissions:
  contents: write

concurrency:
  group: update-subs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install requests
          curl -sL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip xray
          chmod +x xray

      - name: Test servers
        run: python update_subs.py

      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sub.txt sub_raw.txt
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "update subscription"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
